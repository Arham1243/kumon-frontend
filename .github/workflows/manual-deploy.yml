on:
    workflow_dispatch:
        inputs:
            branch:
                description: Branch to deploy (latest commit on that branch)
                required: true
                type: choice
                options:
                    - main
            confirmation:
                description: Confirm deployment (pushes live code to the server)
                required: true
                type: choice
                default: 'no'
                options:
                    - 'no'
                    - 'yes'

name: Manual deploy

run-name: deploy ${{ github.event.inputs.branch }} branch → ${{ github.event.inputs.branch }} environment

concurrency:
    group: manual-ftp-${{ github.event.inputs.branch }}
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    gate:
        runs-on: ubuntu-latest
        steps:
            - name: Confirm deployment
              if: github.event.inputs.confirmation != 'yes'
              run: |
                  echo "::error::Deployment not started. Select yes in the confirmation dropdown."
                  exit 1

    resolve:
        needs: gate
        if: github.event.inputs.confirmation == 'yes'
        runs-on: ubuntu-latest
        outputs:
            branch: ${{ steps.map.outputs.branch }}
            environment: ${{ steps.map.outputs.environment }}
            api_base_url: ${{ steps.map.outputs.api_base_url }}
            app_url: ${{ steps.map.outputs.app_url }}
            ftp_server_secret: ${{ steps.map.outputs.ftp_server_secret }}
            ftp_username_secret: ${{ steps.map.outputs.ftp_username_secret }}
            ftp_password_secret: ${{ steps.map.outputs.ftp_password_secret }}
        steps:
            - name: Map branch to deploy target
              id: map
              env:
                  SELECTED_BRANCH: ${{ github.event.inputs.branch }}
              run: |
                  environment=
                  api_base_url=
                  app_url=
                  ftp_server_secret=
                  ftp_username_secret=
                  ftp_password_secret=
                  case "$SELECTED_BRANCH" in
                    main)
                      environment=main
                      api_base_url=https://kumon.servicore.io/backend
                      app_url=https://kumon.servicore.io
                      ftp_server_secret=FTP_SERVER_MAIN
                      ftp_username_secret=FTP_USERNAME_MAIN
                      ftp_password_secret=FTP_PASSWORD_MAIN
                      ;;
                    *)
                      echo "::error::No deploy target mapped for branch '$SELECTED_BRANCH'."
                      exit 1
                      ;;
                  esac

                  if [ -z "$api_base_url" ]; then
                    echo "::error::api_base_url is empty for branch '$SELECTED_BRANCH'."
                    exit 1
                  fi

                  {
                    echo "branch=$SELECTED_BRANCH"
                    echo "environment=$environment"
                    echo "api_base_url=$api_base_url"
                    echo "app_url=$app_url"
                    echo "ftp_server_secret=$ftp_server_secret"
                    echo "ftp_username_secret=$ftp_username_secret"
                    echo "ftp_password_secret=$ftp_password_secret"
                  } >> "$GITHUB_OUTPUT"

    web-deploy:
        name: deploy ${{ needs.resolve.outputs.branch }} branch → ${{ needs.resolve.outputs.environment }} environment
        needs: resolve
        if: github.event.inputs.confirmation == 'yes'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ${{ needs.resolve.outputs.environment }}
        steps:
            - name: Get latest code on ${{ needs.resolve.outputs.branch }}
              uses: actions/checkout@v6
              with:
                  ref: refs/heads/${{ needs.resolve.outputs.branch }}
                  fetch-depth: 0

            - name: Build Vue app for ${{ needs.resolve.outputs.environment }}
              run: |
                  if [ -z "$VITE_API_BASE_URL" ]; then
                    echo "::error::VITE_API_BASE_URL is empty. Refusing to build."
                    exit 1
                  fi
                  npm install
                  npm run build
              env:
                  VITE_API_BASE_URL: ${{ needs.resolve.outputs.api_base_url }}

            - name: Verify API base URL is baked into the production bundle
              run: |
                  if ! grep -rqF "$VITE_API_BASE_URL" dist/assets/; then
                    echo "::error::Production build is missing VITE_API_BASE_URL ($VITE_API_BASE_URL)."
                    exit 1
                  fi
              env:
                  VITE_API_BASE_URL: ${{ needs.resolve.outputs.api_base_url }}

            - name: Sync build to ${{ needs.resolve.outputs.environment }}
              uses: SamKirkland/FTP-Deploy-Action@v4.3.6
              with:
                  server: ${{ secrets[needs.resolve.outputs.ftp_server_secret] }}
                  username: ${{ secrets[needs.resolve.outputs.ftp_username_secret] }}
                  password: ${{ secrets[needs.resolve.outputs.ftp_password_secret] }}
                  protocol: ftps
                  port: 21
                  security: loose
                  log-level: verbose
                  timeout: 600000
                  local-dir: ./dist/
                  server-dir: /
                  exclude: |
                      backend/**
                  dangerous-clean-slate: false
