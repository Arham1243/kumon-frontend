<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk celebration screens</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F2FB;--fg:#2A1B4D;--mut:#6B5B8F;--card:#fff;--line:#DCD2EE}
@media (prefers-color-scheme:dark){:root{--bg:#1B1530;--fg:#F1EAFF;--mut:#B3A5D6;--card:#271E45;--line:#3E3262}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font-family:"Fredoka",system-ui,sans-serif}
h1{font-size:22px;font-weight:700;margin:0 0 4px}
p.s{margin:0 0 16px;color:var(--mut);font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
input{font:inherit;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:150px}
button{font:inherit;cursor:pointer;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
button.on{background:#7A3FB5;border-color:#7A3FB5;color:#fff}
#main{max-width:680px;border-radius:20px;overflow:hidden;border:2px solid var(--line)}
svg{display:block;width:100%;height:auto}
.hero{animation:bob 1.3s ease-in-out infinite}
.tw{animation:tw 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes tw{50%{opacity:.35}}
h2{font-size:17px;font-weight:700;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.th{cursor:pointer;border:0;padding:0;background:none;text-align:left;color:var(--fg)}
.th .box{border-radius:12px;overflow:hidden;border:2px solid transparent}
.th.sel .box{border-color:#7A3FB5}
.th span{display:block;font-size:13px;margin-top:4px;color:var(--mut)}
.th .hero,.th .tw{animation:none}
@media (prefers-reduced-motion:reduce){.hero,.tw{animation:none}}
</style>
</head>
<body>
<h1>Kiosk celebration screens</h1>
<p class="s">8 biomes, 3 characters each = 24 celebration screens, every kiosk message, and 24 already-checked-out layouts (one per biome and character, same as live).</p>
<div class="bar">
<input id="nm" value="John" maxlength="14" aria-label="Student name">
<button id="bi" class="on">Check in</button>
<button id="bo">Check out</button>
<button id="rn">Random screen</button>
</div>
<div id="main"></div>
<div id="all"></div>

function pillSvgTwoLines(tx,line1,line2){

const y=258-h;
const y1=y+fs+6;
const y2=y1+fs+2;
return `<rect x="16" y="${y}" width="368" height="${h}" rx="${h/2}" fill="#fff" opacity=".92"/><text x="200" y="${y1}" text-anchor="middle" font-family="Fredoka,system-ui,sans-serif" font-weight="700" font-size="${fs}" fill="${tx}">${line1}</text><text x="200" y="${y2}" text-anchor="middle" font-family="Fredoka,system-ui,sans-serif" font-weight="700" font-size="${fs}" fill="${tx}">${line2}</text>`;

}[k];

const ERR=[
'invalid_student_id',
'card_not_registered',
'wait_before_checkout',
'unable_to_record',
'rate_limited',
'load_not_found',
'load_error',
'offline'
];

T.forEach((t,ti)=>t.ch.forEach((c,ci)=>CHECKOUT.push({ti,ci})));

let mode='in',cur=0;
const main=document.getElementById('main'),all=document.getElementById('all'),nm=document.getElementById('nm');
const ALL=F.map(f=>({t:'b',ti:f[0],ci:f[1]})).concat(ERR.map(k=>({t:'e',k}))).concat(CHECKOUT.map(x=>({t:'c',ti:x.ti,ci:x.ci})));
const nameVal=()=>(nm.value.trim()||'friend').toUpperCase();
const draw=it=>{
if(it.t=='b')return screen(it.ti,it.ci,mode,nameVal());
if(it.t=='e')return errScreen(it.k,nameVal());
return checkoutCelebration(it.ti,it.ci,nameVal());
};
function thumb(i,label,gr){
const b=document.createElement('button');b.className='th'+(i==cur?' sel':'');
b.innerHTML=`<div class="box">${draw(ALL[i])}</div><span>${label}</span>`;
b.onclick=()=>{cur=i;render();main.scrollIntoView({behavior:'smooth',block:'nearest'})};
gr.appendChild(b);
}
function head(txt){const h=document.createElement('h2');h.textContent=txt;all.appendChild(h);const gr=document.createElement('div');gr.className='grid';all.appendChild(gr);return gr}
function render(){
main.innerHTML=draw(ALL[cur]);
all.innerHTML='';
T.forEach((t,ti)=>{const gr=head(t.n);t.ch.forEach((c,ci)=>thumb(ALL.findIndex(x=>x.t=='b'&&x.ti==ti&&x.ci==ci),c[0],gr))});
const ge=head('Kiosk messages (same copy as live page)');
const errLabels={
invalid_student_id:'Student ID is not valid.',
card_not_registered:'This card is not registered.',
wait_before_checkout:'Wait before check out',
unable_to_record:'Unable to record',
rate_limited:'Too many attempts',
load_not_found:'Page not available',
load_error:'Load error',
offline:'No internet'
};
ERR.forEach(k=>thumb(ALL.findIndex(x=>x.t=='e'&&x.k==k),errLabels[k],ge));
const gc=head('Already checked out (all themes, live layout)');
CHECKOUT.forEach(({ti,ci})=>{
const t=T[ti],c=t.ch[ci];
thumb(ALL.findIndex(x=>x.t=='c'&&x.ti===ti&&x.ci===ci),`${t.n}: ${c[0]}`,gc);
});
}
function setMode(m){mode=m;bi.className=m=='in'?'on':'';bo.className=m=='out'?'on':'';render()}
bi.onclick=()=>setMode('in');bo.onclick=()=>setMode('out');
rn.onclick=()=>{let n;do{n=Math.floor(Math.random()*F.length)}while(n==cur);cur=n;render()};

render();
